name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          BILLING_ENCRYPTION_KEY: ci-placeholder
          CI: 'true'
          CRON_SECRET: ci-placeholder
          DATABASE_URL: postgresql://ci@127.0.0.1:1/ci
          LEMONSQUEEZY_API_KEY: ci-placeholder
          LEMONSQUEEZY_STORE_ID: '0'
          LEMONSQUEEZY_VARIANT_ID: '0'
          LEMONSQUEEZY_WEBHOOK_SECRET: ci-placeholder
          NEXT_PUBLIC_SERVICE_URL: http://127.0.0.1:5173
          RESEND_API_KEY: ci-placeholder
          SERVICE_URL: http://127.0.0.1:5173
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: http://127.0.0.1:1
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SUPABASE_URL: http://127.0.0.1:1
