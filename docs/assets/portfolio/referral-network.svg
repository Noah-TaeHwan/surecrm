    </linearGradient>
    <linearGradient id="referral-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#e64c24" />
    </linearGradient>
    <filter id="referral-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17121b" flood-opacity="0.14" />
    </filter>
    <filter id="referral-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f15a2b" flood-opacity="0.34" />
    </filter>
