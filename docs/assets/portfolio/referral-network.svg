  <title id="referral-network-title">Synthetic SureCRM referral network preview</title>
  <desc id="referral-network-description">
    An illustrative product interface showing a referral graph made from fictional English names and synthetic relationship counts. Orange and blue links distinguish referral direction around a selected demo profile.
  </desc>

